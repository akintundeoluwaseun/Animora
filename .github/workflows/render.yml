# Makes one MP4 for the Animora website (Vercel can't run Chrome + FFmpeg for minutes).
# Started by the website through the GitHub API with the job's URL; nothing to run by hand.
# Built for speed: only the files the recorder needs are checked out (no sample videos), installed
# packages / FFmpeg / fonts / the recording browser come from caches, and every CPU core records frames.
name: Render video
on:
  workflow_dispatch:
    inputs:
      job_url:
        description: Job URL from the Animora website
        required: true
        type: string
concurrency:
  group: render-${{ github.run_id }}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            server
            scripts
            assets/sfx
            assets/music
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # installed packages are cached as they are (restoring takes ~2 s; npm ci only runs when package-lock.json changes)
      - uses: actions/cache@v4
        id: modules
        with:
          path: node_modules
          key: modules-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --omit=dev --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      # FFmpeg + fonts are kept between runs (first run installs them, ~20 s; later runs ~2 s)
      - uses: actions/cache@v4
        id: tools
        with:
          path: ~/tools
          key: tools-v1-${{ runner.os }}
      - name: Install FFmpeg and fonts
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tools/bin ~/tools/fonts
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-core fonts-noto-color-emoji fonts-dejavu-core > /dev/null
          curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ -C /tmp && cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe ~/tools/bin/ || (sudo apt-get install -y -qq ffmpeg > /dev/null && ln -sf "$(command -v ffmpeg)" ~/tools/bin/ffmpeg)
          cp -r /usr/share/fonts/truetype/noto /usr/share/fonts/truetype/dejavu ~/tools/fonts/ 2>/dev/null || true
      - name: Use FFmpeg and fonts
        run: |
          echo "$HOME/tools/bin" >> "$GITHUB_PATH"
          mkdir -p ~/.local/share/fonts && cp -r ~/tools/fonts/* ~/.local/share/fonts/ 2>/dev/null || true
          fc-cache -f > /dev/null 2>&1 || true
      - uses: actions/cache@v4
        id: chrome
        with:
          path: ~/.cache/puppeteer
          key: chrome-headless-shell-${{ hashFiles('package-lock.json') }}
      - name: Get the recording browser
        if: steps.chrome.outputs.cache-hit != 'true'
        run: npx puppeteer browsers install chrome-headless-shell
      # Natural voice-over (Kokoro, free, runs here): the Python packages and the voice model are cached between runs
      - uses: actions/cache@v4
        id: voice
        with:
          path: |
            ~/kokoro
            ~/.cache/pip
          key: kokoro-v1-${{ runner.os }}
      - name: Get the voice engine
        run: |
          pip install --quiet --user --break-system-packages kokoro-onnx==0.6.1 soundfile > /dev/null 2>&1 || pip install --quiet --user kokoro-onnx==0.6.1 soundfile
          mkdir -p ~/kokoro
          [ -s ~/kokoro/kokoro-v1.0.int8.onnx ] || curl -sSL -o ~/kokoro/kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -s ~/kokoro/voices-v1.0.bin ] || curl -sSL -o ~/kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Record the video
        run: ADFLASH_WORKERS=$(nproc) node scripts/render-job.js "$JOB_URL"
        env:
          JOB_URL: ${{ inputs.job_url }}
          ADFLASH_CAPTURE_MODE: beginframe
