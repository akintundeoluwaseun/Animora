# Makes one MP4 for the Animora website (Vercel can't run Chrome + FFmpeg for minutes).
# Started by the website through the GitHub API with the job's URL; nothing to run by hand.
name: Render video
on:
  workflow_dispatch:
    inputs:
      job_url:
        description: Job URL from the Animora website
        required: true
        type: string
concurrency:
  group: render-${{ github.run_id }}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg and fonts
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-dejavu-core > /dev/null)
      - name: Install
        run: npm ci --no-audit --no-fund --omit=dev
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: chrome-headless-shell-${{ hashFiles('package-lock.json') }}
      - name: Get the recording browser
        run: npx puppeteer browsers install chrome-headless-shell
      - name: Record the video
        run: node scripts/render-job.js "$JOB_URL"
        env:
          JOB_URL: ${{ inputs.job_url }}
          ADFLASH_WORKERS: '4'
