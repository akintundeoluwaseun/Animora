<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="adflash" content="width=1080,height=1920,duration=20,fps=30,engine=motion-v4">
<title>Burger Bros - Combo Madness</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@600;800&display=block" rel="stylesheet">
<style>
  :root { --primary: #FF3B3B; --secondary: #2D5BFF; --bg: #FFE45E; --text: #111111; --scale: 1;
    --on-primary: #FFFFFF; --on-secondary: #FFFFFF; --surface: #FFFFFF; --line: rgba(15,15,40,.09); --shadow: 0 30px 70px -20px rgba(20,20,60,.25);
    --muted: color-mix(in srgb, var(--text) 62%, var(--bg)); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  * { box-sizing: border-box; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Bungee','Inter','Poppins','DejaVu Sans',Arial,sans-serif; }
  #bg, #cam, #fx { position: absolute; inset: 0; }
  #bg { overflow: hidden; z-index: 0; } #cam { z-index: 5; } #fx { z-index: 50; pointer-events: none; overflow: hidden; }
  .bt { position: absolute; inset: 0; visibility: hidden; opacity: 0; perspective: 1600px; }
  .bx, .bi { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transform-style: preserve-3d; }
  .fitbox { position: relative; transform-origin: 50% 50%; }
  .col { display: flex; flex-direction: column; } .center { align-items: center; text-align: center; }
  .col > * + * { margin-top: 34px; }

  /* ---------- type ---------- */
  .tx-line { font-weight: 400; line-height: 1.06; letter-spacing: 0px; max-width: 928.8px;
    text-transform: uppercase;  }
  .tx-line.small { font-weight: 400; }
  .tx-sub { font-family: 'Rubik','Inter','Poppins','DejaVu Sans',Arial,sans-serif; font-weight: 600; color: var(--muted); line-height: 1.3; max-width: 928.8px; }
  .wd { display: inline-block; overflow: hidden; vertical-align: top; position: relative; padding: .08em .05em .16em; margin: -.08em -.05em -.16em; }
  .wi { display: inline-block; position: relative; z-index: 1; }
  .acc .wi { color: var(--primary); }
  .mkd .wi { color: var(--on-primary); padding: 0 .12em; }
  .mk { position: absolute; z-index: 0; left: 0; right: 0; top: .1em; bottom: .12em; background: var(--primary); border-radius: .14em; transform-origin: 0 50%; }
  .kin { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
  .kin-line { font-weight: 400; line-height: .98; letter-spacing: 0px; white-space: nowrap; text-transform: uppercase;  }
  .kin-line.small { font-family: 'Rubik','Inter','Poppins','DejaVu Sans',Arial,sans-serif; font-weight: 600; color: var(--muted); margin: 6px 0; }
  .kin-line.acc span { color: var(--primary); }
  .zw { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .zw-main, .zw-echo { font-weight: 400; line-height: 1; white-space: nowrap; letter-spacing: 0px; text-transform: uppercase;  }
  .zw-echo { position: absolute; color: transparent; -webkit-text-stroke: 3px var(--primary); }
  .zw-sub { position: absolute; top: 100%; margin-top: 40px; white-space: nowrap; }
  .sel { position: relative; display: inline-block; padding: 18px 30px; border: 4px solid var(--primary); }
  .sel-text { position: relative; z-index: 2; white-space: nowrap; font-weight: 400; line-height: 1.1; text-transform: uppercase; }
  .ch { display: inline-block; }
  .hd { position: absolute; width: 22px; height: 22px; background: #fff; border: 4px solid var(--primary); border-radius: 5px; z-index: 3; }
  .hd.tl { left: -13px; top: -13px; } .hd.tr { right: -13px; top: -13px; } .hd.bl { left: -13px; bottom: -13px; } .hd.br { right: -13px; bottom: -13px; }
  .cursor { position: absolute; right: -6px; top: 15%; bottom: 15%; width: 6px; background: var(--primary); z-index: 3; }
  .sel-fill { position: absolute; inset: 0; background: color-mix(in srgb, var(--primary) 22%, transparent); transform-origin: 0 50%; z-index: 1; }

  /* ---------- brand / marks ---------- */
  .mark { position: relative; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 26%; }
  .mark.mono { background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 55%, var(--secondary))); color: var(--on-primary);
    font-weight: 800; font-family: 'Bungee','Inter','Poppins','DejaVu Sans',Arial,sans-serif; box-shadow: var(--shadow); }
  .mark.logo img { width: 100%; height: 100%; object-fit: contain; }
  .mark.logo.card { background: #fff; box-shadow: var(--shadow); }
  .mark.logo.card img { width: 80%; height: 80%; }   /* inner space as a share of the mark (padding % would follow the page width) */
  .mark.logo.photo { overflow: hidden; } .mark.logo.photo img { width: 100%; height: 100%; object-fit: cover; }
  .mark.logo.card.ink { background: #0B0A12; }   /* light logos sit on a dark card */
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 928.8px; }
  .chip { font-family: 'Rubik','Inter','Poppins','DejaVu Sans',Arial,sans-serif; font-weight: 600; font-size: 40px; padding: 14px 30px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); }
  .burst-dot { position: absolute; left: 50%; top: 50%; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--primary); z-index: 0; }
  .burst-dot.c1 { background: var(--secondary); } .burst-dot.c2 { background: var(--text); opacity: .6; }

  /* ---------- orbit ---------- */
  .orbit { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .orb { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 14px; white-space: nowrap; font-family: 'Rubik','Inter','Poppins','DejaVu Sans',Arial,sans-serif; font-weight: 700; font-size: 58px;
    padding: 20px 34px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); box-shadow: var(--shadow); }
  .orb .ic { width: 44px; height: 44px; color: var(--primary); }
  .orb.photo { padding: 0; width: 220px; height: 220px; border-radius: 40px; overflow: hidden; }
  .orb.photo img { width: 100%; height: 100%; object-fit: cover; }
  .orbit-c { z-index: 15; }

  /* ---------- counter ---------- */
  .ringbox { position: relative; display: flex; align-items: center; justify-content: center; }
  .ringbox svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .rg-bg { fill: none; stroke: var(--line); stroke-width: 3; }
  .rg { fill: none; stroke: var(--secondary); stroke-width: 3.4; stroke-linecap: round; }
  .rg-dot { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 30px var(--primary); }
  .odo { display: inline-flex; align-items: center; font-weight: 800; line-height: 1; font-family: 'Bungee','Inter','Poppins','DejaVu Sans',Arial,sans-serif; letter-spacing: -0.02em; white-space: nowrap; }
  .odo-pre { font-family: 'Poppins','DejaVu Sans',Arial,sans-serif; margin-right: .05em; }
  .odo-d { display: inline-block; height: 1em; overflow: hidden; }
  .odo-col { display: flex; flex-direction: column; } .odo-col span { height: 1em; line-height: 1; }
  .odo.big { color: var(--text); }
  .odo.chip { background: var(--primary); color: var(--on-primary); padding: .14em .4em; border-radius: 999px; }

  /* ---------- card ---------- */
  .card-hold { perspective: 1400px; display: flex; align-items: center; justify-content: center; }
  .ui-card { position: relative; background: var(--surface); border: 2px solid var(--line); box-shadow: var(--shadow); overflow: hidden; display: flex; align-items: center; justify-content: center;
    transform-style: preserve-3d; }
  .cc { align-items: flex-start; text-align: left; }
  .cc > * + * { margin-top: 22px; }
  .cc-ic { width: 130px; height: 130px; border-radius: 32px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; }
  .cc-ic .ic { width: 58%; height: 58%; }
  .cc-title { font-weight: 400; line-height: 1.1; text-transform: uppercase; }
  .odo.card { color: var(--primary); }
  .cc-sub { font-family: 'Rubik','Inter','Poppins','DejaVu Sans',Arial,sans-serif; color: var(--muted); font-weight: 600; }
  .cc-btn { display: inline-flex; align-items: center; gap: 14px; padding: 18px 34px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-family: 'Rubik','Inter','Poppins','DejaVu Sans',Arial,sans-serif; font-weight: 700; font-size: 38px; }
  .cc-btn .ic { width: 38px; height: 38px; }

  /* ---------- pills / wheel / flow / grid ---------- */
  .pills { display: flex; flex-direction: column; gap: 22px; width: 900px; }
  .pill { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 30px 30px 30px 48px; border-radius: 999px;
    background: var(--surface); border: 2px solid var(--line); box-shadow: var(--shadow); font-family: 'Rubik','Inter','Poppins','DejaVu Sans',Arial,sans-serif; font-weight: 700; }
  .pill-n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill-p { background: var(--primary); color: var(--on-primary); padding: 12px 28px; border-radius: 999px; white-space: nowrap; }
  .wheel-wrap { display: flex; flex-direction: column; align-items: center; gap: 40px; }
  .wheel-wrap.row { flex-direction: row; gap: 70px; }
  .ic-badge { width: 220px; height: 220px; border-radius: 30%; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
  .ic-badge .ic { width: 52%; height: 52%; }
  .wheel { position: relative; width: 880px; overflow: hidden;
    -webkit-mask: linear-gradient(transparent, #000 28%, #000 72%, transparent); mask: linear-gradient(transparent, #000 28%, #000 72%, transparent); }
  .wheel-list { position: absolute; left: 0; right: 0; top: 0; }
  .wheel-row { display: flex; justify-content: space-between; align-items: center; gap: 30px; padding: 0 40px; font-family: 'Rubik','Inter','Poppins','DejaVu Sans',Arial,sans-serif; font-weight: 700; transform-origin: 50% 50%; white-space: nowrap; }
  .wheel-row b { color: var(--muted); }
  .wheel-row.on { color: var(--text); } .wheel-row.on b { color: var(--primary); }
  .wheel-row.on::before { content: ''; position: absolute; left: 0; right: 0; top: 8%; bottom: 8%; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); z-index: -1; }
  .flow { display: flex; flex-direction: column; align-items: center; }
  .flow.row { flex-direction: row; }
  .flow-card { display: flex; align-items: center; gap: 24px; padding: 30px 44px; border-radius: 36px; background: var(--surface); border: 2px solid var(--line);
    box-shadow: var(--shadow), 0 0 60px color-mix(in srgb, var(--primary) 25%, transparent); font-family: 'Rubik','Inter','Poppins','DejaVu Sans',Arial,sans-serif; font-weight: 700; min-width: 560px; }
  .flow.row .flow-card { flex-direction: column; min-width: 320px; text-align: center; }
  .fc-ic { width: 90px; height: 90px; border-radius: 26px; background: color-mix(in srgb, var(--primary) 18%, transparent); color: var(--primary); display: flex; align-items: center; justify-content: center; flex: none; }
  .fc-ic .ic { width: 58%; height: 58%; }
  .flow-link { position: relative; width: 6px; height: 90px; background: color-mix(in srgb, var(--primary) 40%, transparent); overflow: hidden; transform-origin: 50% 0; }
  .flow.row .flow-link { width: 110px; height: 6px; transform-origin: 0 50%; }
  .flow-pulse { position: absolute; left: 0; top: 0; width: 100%; height: 40%; background: linear-gradient(transparent, var(--secondary), transparent); }
  .flow.row .flow-pulse { width: 40%; height: 100%; background: linear-gradient(90deg, transparent, var(--secondary), transparent); }
  .grid { display: grid; gap: 24px; }
  .grid.g2 { grid-template-columns: repeat(2, 450px); } .grid.g3 { grid-template-columns: repeat(3, 380px); }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 36px 24px; border-radius: 40px; background: var(--surface); border: 2px solid var(--line);
    box-shadow: var(--shadow); font-family: 'Rubik','Inter','Poppins','DejaVu Sans',Arial,sans-serif; font-weight: 700; text-align: center; }
  .tile b { color: var(--primary); }
  .tile-ic { width: 110px; height: 110px; border-radius: 30%; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; }
  .tile-ic .ic { width: 55%; height: 55%; }

  /* ---------- split ---------- */
  .split-panel { position: absolute; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 2;
    left: 0; right: 0; bottom: 0; height: 44%; border-radius: 70px 70px 0 0; }
  .split-circle { width: 330px; height: 330px; border-radius: 50%; background: #fff; color: var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 80px rgba(0,0,0,.25); }
  .split-circle .ic { width: 50%; height: 50%; }
  .split-text { position: absolute; z-index: 3; align-items: flex-start; text-align: left;
    left: 80px; right: 80px; top: 8%; height: 46%; justify-content: center; }

  /* ---------- hero ---------- */
  .hero-word { position: absolute; left: 0; white-space: nowrap; font-weight: 400; line-height: 1; color: transparent; -webkit-text-stroke: 3px color-mix(in srgb, var(--primary) 60%, transparent); z-index: 0;  }
  .hero-word.w0 { top: 14%; } .hero-word.w1 { bottom: 14%; -webkit-text-stroke-color: color-mix(in srgb, var(--secondary) 60%, transparent); }
  .hero-photo { position: relative; z-index: 2; border-radius: 50px; box-shadow: var(--shadow); border: 12px solid #fff; transform-style: preserve-3d; }
  .hp-in { position: absolute; inset: 0; overflow: hidden; border-radius: 38px; }
  .hp-in img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-chip { position: absolute; right: -30px; top: -40px; transform: rotate(-8deg); z-index: 3; }
  .hero-full { position: absolute; inset: 0; overflow: hidden; } .hero-full img { width: 100%; height: 100%; object-fit: cover; }
  .hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.55) 55%, rgba(0,0,0,.85)); }
  .hero-over { z-index: 2; } .hero-over .tx-line { color: #fff; }

  /* ---------- phone / notify / stat / lockup ---------- */
  .phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 40px; perspective: 1400px; }
  .phone-wrap.row { flex-direction: row; gap: 80px; }
  .phone { position: relative; border-radius: 76px; background: #0B0B12; padding: 16px; box-shadow: var(--shadow), 0 0 0 3px rgba(255,255,255,.12) inset; transform-style: preserve-3d; }
  .notch { position: absolute; left: 50%; top: 30px; width: 30%; height: 34px; margin-left: -15%; border-radius: 999px; background: #000; z-index: 3; }
  .scr { position: relative; width: 100%; height: 100%; border-radius: 62px; overflow: hidden; background: #FFFFFF;
    display: flex; flex-direction: column; padding: 90px 34px 34px; color: var(--text); font-family: 'Rubik','Inter','Poppins','DejaVu Sans',Arial,sans-serif; }
  .scr-head { display: flex; align-items: center; gap: 18px; padding-bottom: 24px; border-bottom: 2px solid var(--line); }
  .scr-name { font-weight: 800; font-size: 44px; line-height: 1.1; }
  .scr-body { display: flex; flex-direction: column; gap: 18px; padding-top: 26px; }
  .scr-row { display: flex; justify-content: space-between; gap: 14px; padding: 22px 24px; border-radius: 24px; background: color-mix(in srgb, var(--primary) 9%, transparent); font-weight: 700; font-size: 38px; }
  .scr-row b { color: var(--primary); white-space: nowrap; }
  .scr-btn { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px; padding: 24px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-weight: 800; font-size: 30px; }
  .scr-btn .ic { width: 36px; height: 36px; }
  .notif-wrap { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .notif { display: flex; align-items: center; gap: 26px; padding: 20px; border-radius: 48px; background: var(--surface); border: 2px solid var(--line); box-shadow: var(--shadow); overflow: hidden; }
  .notif-ic { flex: none; }
  .notif-tx { flex: none; font-family: 'Rubik','Inter','Poppins','DejaVu Sans',Arial,sans-serif; }
  .nt-top { display: flex; justify-content: space-between; gap: 20px; color: var(--muted); font-weight: 600; }
  .nt-top b { color: var(--text); }
  .nt-msg { font-weight: 700; margin-top: 6px; line-height: 1.2; }
  .slab { padding: 60px 90px; border-radius: 60px; background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 50%, var(--secondary))); color: var(--on-primary);
    box-shadow: var(--shadow), 0 40px 0 color-mix(in srgb, var(--primary) 50%, black); }
  .slab-num { font-weight: 800; line-height: 1; white-space: nowrap; }
  .lockup { align-items: center; }
  .lk-top { display: flex; flex-direction: column; align-items: center; gap: 36px; }
  .lockup.row .lk-top { flex-direction: row; text-align: left; }
  .lk-div { display: block; width: 260px; height: 5px; border-radius: 9px; background: var(--primary); }
  .lockup.row .lk-div { width: 5px; height: 240px; }
  .lk-text { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .lockup.row .lk-text { align-items: flex-start; }
  .cta-btn { position: relative; display: inline-flex; align-items: center; gap: 22px; padding: 34px 60px; border-radius: 999px; background: var(--primary); color: var(--on-primary);
    font-family: 'Rubik','Inter','Poppins','DejaVu Sans',Arial,sans-serif; font-weight: 800; white-space: nowrap; box-shadow: 0 24px 60px color-mix(in srgb, var(--primary) 45%, transparent); }
  .cta-btn .ic { width: 1.1em; height: 1.1em; }
  .click-ring { position: absolute; inset: -10px; border-radius: 999px; border: 6px solid var(--primary); opacity: 0; }
  .cursor-arrow { position: absolute; width: 70px; height: 70px; z-index: 20; filter: drop-shadow(0 8px 12px rgba(0,0,0,.35)); }
  .cursor-arrow svg { width: 100%; height: 100%; } .cursor-arrow path { fill: #fff; stroke: #111; stroke-width: 1.6; stroke-linejoin: round; }

  /* ---------- transitions ---------- */
  .fx-dot { position: absolute; left: 50%; top: 50%; width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%; background: var(--primary); visibility: hidden;
    box-shadow: 0 0 80px color-mix(in srgb, var(--primary) 60%, transparent); }
  .fx-line { position: absolute; inset: 0; width: 100%; height: 100%; visibility: hidden; }
  .fx-line path { fill: none; stroke: var(--primary); stroke-width: 16px; stroke-linecap: round; filter: drop-shadow(0 0 16px var(--primary)); }
  .fx-wipe { position: absolute; top: -5%; bottom: -5%; left: -5%; width: 110%; border-radius: 90px; }
  .fx-wipe.a { background: var(--primary); } .fx-wipe.b { background: var(--secondary); }
  .fx-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }


  /* ---------- logo shot ---------- */
  .lg-rings { position: relative; display: flex; align-items: center; justify-content: center; }
  .lg-ring { position: absolute; inset: 0; border-radius: 50%; border: 6px solid var(--primary); opacity: 0; }
  .lg-mark { position: relative; z-index: 2; box-shadow: 0 30px 90px color-mix(in srgb, var(--primary) 45%, transparent); }
  .lg-mark.logo:not(.card) { box-shadow: none; } .lg-mark.logo:not(.card) img { filter: drop-shadow(0 24px 50px color-mix(in srgb, var(--primary) 40%, transparent)); }
  /* ---------- premium shots ---------- */
  .sent { max-width: 907.2px; }
  .sent-line { font-weight: 400; line-height: 1.18; letter-spacing: -0.02em; text-align: center; max-width: 907.2px; }
  .sent-line.small { font-weight: 600; color: var(--muted); }
  .sw { display: inline-block; } .sw .wi { display: inline-block; } .sl { display: inline-block; }
  .flip { display: grid; place-items: center; }
  .flip-c { grid-area: 1 / 1; white-space: nowrap; font-weight: 400; letter-spacing: -0.03em; line-height: 1.05; }
  .flip-c.acc { color: var(--primary); }
  .wg-row { display: flex; gap: 30px; align-items: center; }
  .wg { position: relative; flex: none; display: flex; flex-direction: column; justify-content: space-between; padding: 28px; border-radius: 64px;
    background: linear-gradient(160deg, color-mix(in srgb, var(--primary) 26%, #15151c), #0d0d12); color: #fff; box-shadow: var(--shadow); font-family: 'Rubik','Inter','Poppins','DejaVu Sans',Arial,sans-serif; }
  .wg-top { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 34px; white-space: nowrap; overflow: hidden; }
  .wg-top span { overflow: hidden; text-overflow: ellipsis; }
  .wg-top i { flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--secondary); }
  .wg-ring { position: relative; width: 62%; aspect-ratio: 1; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
  .wg-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .wg-rb { fill: none; stroke: rgba(255,255,255,.12); stroke-width: 3.4; } .wg-r { fill: none; stroke: var(--primary); stroke-width: 3.4; stroke-linecap: round; }
  .wg-ring .ic { width: 42%; height: 42%; color: var(--primary); }
  .wg-val { font-weight: 800; font-size: 46px; white-space: nowrap; }
  .im { display: flex; align-items: center; justify-content: center; }
  .im-box { display: flex; align-items: center; gap: 34px; overflow: hidden; border-radius: 64px; background: var(--surface); border: 2px solid var(--line); box-shadow: var(--shadow); }
  .im-ic { flex: none; width: 150px; height: 150px; border-radius: 40px; display: flex; align-items: center; justify-content: center; color: var(--primary);
    background: color-mix(in srgb, var(--primary) 12%, transparent); }
  .im-ic .ic { width: 56%; height: 56%; }
  .im-tx { flex: none; display: flex; flex-direction: column; gap: 10px; padding-right: 40px; font-family: 'Rubik','Inter','Poppins','DejaVu Sans',Arial,sans-serif; }
  .im-title { font-weight: 800; line-height: 1.1; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .im-sub { color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .im-bar { height: 16px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .im-bar i { display: block; height: 100%; border-radius: 99px; background: var(--primary); transform-origin: 0 50%; }

  // Sounds for each kind of shot, at the moment its main movement lands.
  function shotSfx(b) {
    const at = b.in, n = (b.items || []).length;
    const each = (k, from, gap, vol) => { for (let j = 0; j < Math.min(n, 6); j++) sfx(from + j * gap, k, vol); };
    switch (b.shot) {
      case 'logo': sfx(at, 'impact', 0.7); sfx(at + 0.45, 'chime', 0.5); break;
      case 'brand': sfx(at, 'pop', 0.7); sfx(at + 0.7, 'chime', 0.45); break;
      case 'zoomword': sfx(at, 'zoom', 0.5); break;
      case 'kinetic': sfx(at, 'whoosh', 0.45); break;
      case 'flip': { const w = String(b.text || '').split(/\s+/).filter(Boolean); const c = w.length <= 4 ? w.length : Math.ceil(w.length / 2); const step = Math.min(0.6, ((b.t1 - at) * 0.62) / Math.max(1, c)); for (let j = 0; j < c; j++) sfx(at + j * step, 'tick', 0.5); break; }
      case 'sentence': sfx(at, 'swish', 0.35); break;
      case 'scatter': sfx(at + Math.min(0.9, 0.18 * String(b.text || '').split(/\s+/).length + 0.35), 'whoosh', 0.45); break;
      case 'words': sfx(at, 'swish', 0.3); break;
      case 'card': case 'iconmorph': sfx(at, 'pop', 0.65); sfx(at + 0.6, 'swish', 0.4); break;
      case 'notify': sfx(at + 0.45, 'ding', 0.65); for (let j = 1; j < Math.min(3, 1 + (b.subs || []).length); j++) sfx(at + j * 0.45 + 0.6, 'pop', 0.45); break;
      case 'counter': for (let j = 0; j < 4; j++) sfx(at + 0.4 + j * 0.18, 'tick', 0.25); sfx(at + 1.25, 'pop', 0.5); break;
      case 'isocard': sfx(at + 0.1, 'whoosh-low', 0.4); sfx(at + Math.min(1.4, (b.t1 - at) * 0.45) + 0.5, 'pop', 0.6); break;
      case 'stat': sfx(at + 0.3, 'pop', 0.5); break;
      case 'hero': sfx(at, 'whoosh', 0.55); break;
      case 'split': sfx(at, 'whoosh', 0.5); sfx(at + 0.4, 'pop', 0.5); break;
      case 'phone': sfx(at, 'whoosh-low', 0.5); each('tick', at + 0.55, 0.1, 0.3); break;
      case 'orbit': sfx(at, 'swish', 0.5); break;
      case 'collage': for (let j = 0; j < 6; j++) sfx(at + j * 0.05 * 2, 'pop', 0.3); break;
      case 'pills': case 'stack': case 'grid': case 'flow': case 'widgets': case 'wheel': case 'ticker':
        each('pop', at + 0.15, b.shot === 'ticker' ? Math.max(0.35, (b.t1 - at - 1.3) / Math.max(1, n)) : 0.12, 0.42); break;
      default: break;
    }
  }

      '.sr>*+*{margin-top:' + n(40) + '} .sr-pill{display:flex;align-items:center;gap:.25em;padding:.35em .7em;border-radius:999px;background:var(--surface);border:' + n(2) + ' solid var(--line);box-shadow:var(--shadow)}',
      '.sr-s{position:relative;width:1em;height:1em;display:inline-block} .sr-s svg{position:absolute;inset:0;width:100%;height:100%;fill:color-mix(in srgb,var(--text) 14%,transparent)}',
      '.sr-s i{position:absolute;inset:0;background:#FFC531;-webkit-mask:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z%27/%3E%3C/svg%3E") center/100% 100%;mask:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z%27/%3E%3C/svg%3E") center/100% 100%;transform-origin:0 50%;transform:scaleX(0)}',
      '.sr-n{margin-left:.3em;font-size:.62em;font-weight:800;color:var(--text);white-space:nowrap}',
      '.pr>*+*{margin-top:' + n(44) + '} .pr-bar{display:flex;align-items:center;gap:' + n(20) + ';padding:' + n(18) + ' ' + n(18) + ' ' + n(18) + ' ' + n(24) + ';border-radius:999px;background:var(--surface);border:' + n(2) + ' solid var(--line);box-shadow:var(--shadow);overflow:hidden}',
      '.pr-plus{flex:none;width:' + n(76) + ';height:' + n(76) + ';border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:' + n(48) + ';color:var(--muted);background:color-mix(in srgb,var(--text) 6%,transparent)}',
      '.pr-field{position:relative;flex:1;min-width:0;white-space:nowrap;overflow:hidden;font-weight:600;color:var(--text)} .pr-ph{position:absolute;left:0;top:0;color:var(--muted)}',
      '.pr-caret{display:inline-block;width:.08em;height:1em;margin-left:.05em;vertical-align:-.12em;background:var(--primary)}',
      '.pr-send{flex:none;width:' + n(84) + ';height:' + n(84) + ';border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center} .pr-send svg{width:50%;height:50%;fill:none;stroke:var(--on-primary);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}',
      '.wsw>*+*{margin-top:' + n(40) + '} .wsw-stack{position:relative} .wsw-pill{position:relative;z-index:3;display:flex;justify-content:center;padding:.32em .7em;border-radius:999px;background:var(--surface);border:' + n(2) + ' solid var(--line);box-shadow:var(--shadow);height:1.75em}',
      '.wsw-w{position:absolute;left:50%;transform:translateX(-50%);top:.32em;text-align:center;white-space:nowrap;' + type + 'line-height:1.1;overflow:hidden} .wsw-w .cr{display:inline-block}',
      '.wsw-sh{position:absolute;left:4%;right:4%;height:100%;border-radius:999px;background:var(--surface);border:' + n(2) + ' solid var(--line);box-shadow:var(--shadow)} .wsw-sh.a{top:' + n(16) + ';z-index:2;opacity:.8} .wsw-sh.b{top:' + n(32) + ';left:8%;right:8%;z-index:1;opacity:.55}',
      '.rw{display:flex;align-items:center;white-space:nowrap} .rw-lead{' + type + 'margin-right:.28em;line-height:1.2} .rw-slot{position:relative;display:inline-block;height:1.2em;overflow:hidden;vertical-align:bottom}',
      '.rw-w{position:absolute;left:0;top:0;' + type + 'color:var(--primary);white-space:nowrap;line-height:1.2;opacity:0}',
      '.ec-row{display:flex;align-items:center} .ec-row>*+*{margin-left:' + n(30) + '} .ec>*+*{margin-top:' + n(36) + '} .ec-line{' + type + 'white-space:nowrap;letter-spacing:-.01em}',
      '.fin-grain{position:absolute;inset:0;z-index:70;pointer-events:none;mix-blend-mode:overlay}',
      '.fin-vig{position:absolute;inset:0;z-index:69;pointer-events:none}',
      '.fin-leak{position:absolute;inset:-25%;z-index:68;pointer-events:none;mix-blend-mode:screen;visibility:hidden;background:radial-gradient(ellipse 45% 40% at 22% 30%,rgba(255,170,90,.75),rgba(255,90,60,.25) 45%,transparent 70%)}',
      '.fin-leak.b{background:radial-gradient(ellipse 45% 40% at 78% 70%,rgba(255,200,120,.7),rgba(255,120,80,.22) 45%,transparent 70%)}',
    ].join('\n');
    const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    if (TH.glow) stage.classList.add('glowlook');
    if (TH.halo) stage.classList.add('halolook');
  }
  // Film finish: fine moving grain and a soft vignette over everything (look.finish 0 = off, 1 = normal).
  function finish() {
    const F = TH.finish == null ? 0.8 : Number(TH.finish) || 0;
    if (!(F > 0)) return;
    const vig = () => {
      const bgHex = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim().replace('#', '');
      const dark = bgHex.length < 6 || (0.299 * parseInt(bgHex.slice(0, 2), 16) + 0.587 * parseInt(bgHex.slice(2, 4), 16) + 0.114 * parseInt(bgHex.slice(4, 6), 16)) < 128;
      const v = el('div', 'fin-vig', stage);
      v.style.background = 'radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(0,0,0,' + (dark ? 0.42 : 0.12) * Math.min(1.3, F) + ') 100%)';
    };
    vig();
    if (window.__ANIMORA_RENDER) { window.__finish = F; return; }   // the MP4 renderer adds the grain itself
    const S = 160, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'), img = g.createImageData(S, S);
    let z = 987654321;
    for (let i = 0; i < img.data.length; i += 4) { z = (z * 1103515245 + 12345) & 0x7fffffff; const v = 128 + ((z >> 8) % 256 - 128) * 0.9; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    g.putImageData(img, 0, 0);
    const gr = el('div', 'fin-grain', stage);
    gr.style.backgroundImage = 'url(' + c.toDataURL() + ')'; gr.style.opacity = String(Math.min(0.22, 0.13 * F));
    const steps = Math.max(1, Math.round(DURATION * 12));
    tl.fromTo(gr, { backgroundPosition: '0px 0px' }, { backgroundPosition: (steps * 67) + 'px ' + (steps * 101) + 'px', duration: DURATION, ease: 'steps(' + steps + ')', immediateRender: true }, 0);
  }

  // ------------------------------------------------------------------ build
  const afterFonts = [], beforeFit = [];
  premiumCss();
  ambient();
  finish();
  const beats = DATA.beats;
  beats.forEach((b, i) => {
    const bt = el('div', 'bt', cam); bt.id = 'b' + (i + 1);
    const bx = el('div', 'bx', bt); const bi = el('div', 'bi', bx);
    const fe = blurFilter('mb' + (i + 1)); fe._url = 'url(#mb' + (i + 1) + ')';   // the blur filter is switched on only while a cut moves the beat (much faster to render)
    b._el = { bt, bx, bi, fe };
    const cutIn = i > 0 ? beats[i - 1].cut : null;
    b.in = b.t0 + (cutIn ? (cutIn.type === 'morph' ? 0.12 : 0.04) : 0.08);
    (SHOTS[b.shot] || SHOTS.words)(b, bi);
    shotSfx(b);
    tl.set(bt, { autoAlpha: 1 }, b.t0);
    if (i < beats.length - 1) {
      const over = b.cut && b.cut.type === 'iris' ? Math.min(0.55, (beats[i + 1].t1 - beats[i + 1].t0) * 0.4) * 1.2 + 0.03 : 0;   // iris: stays under the opening circle
      tl.set(bt, { autoAlpha: 0 }, FT(b.t1 + over));
    }
  });
  const BLURRY = ['whip', 'rise', 'zoom', 'line', 'swoosh', 'dive', 'focus'];
  // fast cuts in the loud looks also split the colours a little (chromatic aberration)
  const chroma = (a) => (a > 0 ? ' drop-shadow(' + N(7 * a).toFixed(1) + 'px 0 0 rgba(255,30,90,.55)) drop-shadow(' + (-N(7 * a)).toFixed(1) + 'px 0 0 rgba(0,210,255,.5))' : '');
  const filterWindow = (bt, from, to, f) => { tl.set(bt.bx, { filter: f.trim() }, Math.max(0, from)); tl.set(bt.bx, { filter: 'none' }, FT(to)); };
  const blurWindow = (bt, from, to) => filterWindow(bt, from, to, bt.fe._url + chroma(TH.chroma || 0));
  beats.forEach((b, i) => {
    if (i === beats.length - 1 || !b.cut) return;
    const c = b.cut, d = (c.d || 0.3) / SP, nx = beats[i + 1];
    const dOut = Math.min(d, (b.t1 - b.t0) * 0.35), dIn = Math.min(0.55, (nx.t1 - nx.t0) * 0.4);
    exitBeat(b._el, c.type, b.t1, dOut);
    enterBeat(nx._el, c.type, b.t1, dIn);
    if (BLURRY.includes(c.type)) { blurWindow(b._el, b.t1 - dOut - 0.01, b.t1 + 0.01); blurWindow(nx._el, b.t1 - 0.01, b.t1 + dIn + 0.02); }
    else if (c.type === 'glitch') { filterWindow(b._el, b.t1 - dOut - 0.01, b.t1 + 0.01, chroma(1.4)); filterWindow(nx._el, b.t1 - 0.01, b.t1 + dIn + 0.02, chroma(1.4)); }
    cutFx(c.type, b.t1, d, i, dIn);
    const CUT_SND = { whip: ['whoosh', 0.6], swoosh: ['whoosh', 0.7], wipe: ['whoosh', 0.55], rise: ['whoosh-low', 0.6], line: ['whoosh-low', 0.5], zoom: ['zoom', 0.6], dive: ['zoom', 0.75], focus: ['swish', 0.7], morph: ['pop', 0.55], flash: ['swish', 0.6], iris: ['swish', 0.6], cover: ['whoosh', 0.65], cube: ['whoosh-low', 0.7], glitch: ['tick', 0.8], shutter: ['whoosh', 0.55] }[c.type];
    if (CUT_SND) sfx(b.t1 - (c.type === 'morph' ? 0.05 : c.type === 'flash' || c.type === 'glitch' ? 0.03 : dOut * 0.9), CUT_SND[0], CUT_SND[1]);
    if (c.type === 'glitch') sfx(b.t1 + 0.02, 'swish', 0.5);
  });
  // slow camera drift (premium styles): the whole frame breathes and tilts a touch
  if (TH.drift) tl.fromTo(cam, { rotation: -1.4 * TH.drift }, { rotation: 1.4 * TH.drift, duration: DURATION, ease: 'sine.inOut', immediateRender: true }, 0);
  // opening punch
  tl.fromTo(cam, { scale: 1.08 }, { scale: 1, duration: 0.8, ease: 'expo.out', immediateRender: false }, 0);

  // captions (scene voiceover lines), unchanged behaviour
  (DATA.captions || []).forEach((c, k) => {
    const e = el('div', 'cap', stage, '<span>' + esc(c.text) + '</span>');
    tl.fromTo(e, { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.18, ease: 'power2.out', immediateRender: false }, c.t0);
    if (!c.last) tl.to(e, { autoAlpha: 0, duration: 0.12 }, c.t1 - 0.12);
  });

  // fit: shrink any layout box that is larger than the safe area (layout sizes only, transforms ignored)
  function fit() {
    beforeFit.forEach((fn) => fn());
    const padX = Math.min(W, H) * 0.07, padY = Math.min(W, H) * 0.08 + (DATA.captions && DATA.captions.length ? Math.min(W, H) * 0.12 : 0);
    $$('.fitbox').forEach((f) => {
      f.style.transform = '';
      let maxW = f.dataset.maxw ? Number(f.dataset.maxw) : W - padX * 2, maxH = H - padY * 2;
      if (f.classList.contains('cc')) { maxW = parseFloat(f.style.width) || maxW; maxH = parseFloat(f.style.maxHeight) || maxH; }
      if (f.classList.contains('split-text')) { maxH = WIDE ? H - padY * 2 : H * 0.5 - padY; maxW = WIDE ? W * 0.5 - padX * 1.5 : maxW; }
      let wide = f.offsetWidth;
      $$('.wd, .kin-line span, .pill, .wheel-row, .flow-card, .tile, .chip, .cta-btn, .sel, .odo, .slab, .flip-c, .tk-row, .stk-b, .wg-row, .sw', f).forEach((x) => { wide = Math.max(wide, x.offsetWidth); });
      let k = Math.min(1, maxW / Math.max(1, wide), maxH / Math.max(1, f.offsetHeight));
      // landscape: pieces designed for a phone screen are grown so they fill the wide frame
      if (k >= 1 && WIDE && !f.closest('.split-text')) k = Math.max(1, Math.min(1.5, (maxW * 0.62) / Math.max(1, wide), (maxH * 0.64) / Math.max(1, f.offsetHeight)));
      if (k < 1) f.style.transform = 'scale(' + (k * 0.97).toFixed(4) + ')';
      else if (k > 1.03) f.style.transform = 'scale(' + k.toFixed(4) + ')';
    });
    afterFonts.forEach((fn) => fn());
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  // expose the sound cues (sorted; the same sound twice within 60ms plays once)
  SFX.sort((x, y) => x.t - y.t);
  window.__sfx = SFX.filter((e, i, arr) => !arr.slice(Math.max(0, i - 4), i).some((p) => p.k === e.k && e.t - p.t < 0.06));
  tl.set({}, {}, DURATION);
  window.__timeline = tl;
})();
